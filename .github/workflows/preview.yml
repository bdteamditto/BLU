name: BLU review preview
on:
  push:
    branches: [preview]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: blu-preview
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm validate
      - uses: actions/upload-artifact@v4
        with:
          name: content-validation
          path: evidence/content-validation.json
      # Keep the current root preview and publish the separately reviewed V7 under /v7/.
      - name: Checkout V7 review source
        uses: actions/checkout@v4
        with:
          ref: 6804abad973077c52b499cb8630c53b0e4499fb1
          path: v7-source
      - name: Build and validate V7
        run: |
          pnpm --dir v7-source install --frozen-lockfile
          pnpm --dir v7-source build
          pnpm --dir v7-source validate
          mkdir -p dist/v7
          cp -R v7-source/dist/. dist/v7/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy isolated preview
        id: deployment
        uses: actions/deploy-pages@v4


