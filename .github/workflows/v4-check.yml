name: BLU V4 design validation
on:
  push:
    branches: [design/real-homepage-v4]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm validate
      - run: pnpm exec playwright install --with-deps chromium
      - run: |
          pnpm preview > /tmp/blu-v4-preview.log 2>&1 &
          sleep 5
          node scripts/v4-home-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blu-v4-screenshots
          path: |
            evidence/screenshots
            evidence/browser-validation.json
